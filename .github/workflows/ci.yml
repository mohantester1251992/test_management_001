name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ui_automation
          POSTGRES_PASSWORD: ui_automation
          POSTGRES_DB: ui_automation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ui_automation" \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://ui_automation:ui_automation@localhost:5432/ui_automation
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret
      DJANGO_SETTINGS_MODULE: backend.settings.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings
